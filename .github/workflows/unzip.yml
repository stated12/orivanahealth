name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the uploaded zip into the repo
        run: |
          Z="$(ls *.zip | head -n 1)"
          mkdir -p /tmp/x && unzip -o "$Z" -d /tmp/x
          D="$(ls -d /tmp/x/*/ | head -n 1)"
          cp -a "$D". .
          rm -f "$Z"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add ORIVANA Health project" || echo "nothing to commit"
          git push
